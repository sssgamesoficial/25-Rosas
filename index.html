<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Jardín mágico</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">

<style>
  body { margin: 0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>

<canvas id="lienzo"></canvas>

<script>
const canvas = document.getElementById("lienzo");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const maxRosas = 25;
let clicks = 0;
let explosionHecha = false;

// 🌬️ viento global
let vientoTiempo = 0;

// 🌅 día/noche
let tiempoDia = 0;

// 🖼️ imágenes
const imgRosa = new Image();
imgRosa.src = "rosa.png";

const imgSemilla = new Image();
imgSemilla.src = "semilla.png";

// 🌱 semilla
let semillaX = canvas.width / 2;
let semillaY = canvas.height / 2;
let semillaScale = 40;

let cayendo = false;
let plantada = false;
let animandoSemilla = false;

let puntos = [];
let progresoRosas = new Array(maxRosas).fill(0);

// 🌸 pétalos
const petalos = [];

function crearPetalo(x, y) {
  petalos.push({
    x, y,
    vx: Math.random() * 0.2 - 0.1,
    vy: Math.random() * 0.3 + 0.1,
    size: Math.random() * 2 + 1.5,
    rot: Math.random() * Math.PI,
    vr: Math.random() * 0.05 - 0.02
  });
}

function explosionPetalos(x, y) {
  for (let i = 0; i < 80; i++) {
    petalos.push({
      x, y,
      vx: Math.random() * 3 - 1.5,
      vy: Math.random() * -3 - 1,
      size: Math.random() * 3 + 2,
      rot: Math.random() * Math.PI,
      vr: Math.random() * 0.1 - 0.05
    });
  }
}

function dibujarPetalos(viento) {
  ctx.fillStyle = "#ff6b6b";

  petalos.forEach(p => {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);

    ctx.beginPath();
    ctx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();

    p.x += p.vx + viento * 0.3;
    p.y += p.vy;
    p.vy += 0.02;
    p.rot += p.vr;
  });

  petalos.splice(0, petalos.length - 300);
}

// 🦋 MARIPOSAS (más y con colores)
const colores = ["#ff9ed6","#ffd6a5","#a0c4ff","#caffbf","#ffc6ff"];

const mariposas = [];
for (let i = 0; i < 12; i++) {
  mariposas.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height * 0.6,
    vx: Math.random() * 0.6 + 0.2,
    fase: Math.random() * Math.PI,
    color: colores[Math.floor(Math.random()*colores.length)]
  });
}

function dibujarMariposas(viento) {
  mariposas.forEach(m => {
    m.x += m.vx + viento * 0.5;
    m.y += Math.sin(m.fase) * 0.8;
    m.fase += 0.08;

    if (m.x > canvas.width) m.x = -20;

    ctx.save();
    ctx.translate(m.x, m.y);

    const flap = Math.sin(m.fase) * 0.6;

    ctx.fillStyle = m.color;

    ctx.beginPath();
    ctx.ellipse(-6, 0, 6, 10, flap, 0, Math.PI*2);
    ctx.ellipse(6, 0, 6, 10, -flap, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#333";
    ctx.fillRect(-1, -6, 2, 12);

    ctx.restore();
  });
}

// ✨ partículas mágicas
const particulas = [];
for (let i = 0; i < 50; i++) {
  particulas.push({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    size: Math.random()*2,
    fase: Math.random()*Math.PI
  });
}

function dibujarMagia() {
  particulas.forEach(p=>{
    p.fase += 0.05;
    p.y -= 0.2;

    ctx.globalAlpha = (Math.sin(p.fase)+1)/2;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();

    if(p.y < 0) p.y = canvas.height;
  });

  ctx.globalAlpha = 1;
}

// 🌹 rosas suelo
const rosasSuelo = [];

function agregarRosaSuelo() {
  for (let i = 0; i < 6; i++) {
    rosasSuelo.push({
      x: Math.random() * canvas.width,
      y: canvas.height * 0.75 + Math.random() * 80,
      size: Math.random() * 30 + 30
    });
  }
}

function dibujarRosasSuelo(viento) {
  rosasSuelo.forEach(r => {
    ctx.drawImage(imgRosa, r.x + viento*2, r.y, r.size, r.size);
  });
}

// 🌅 fondo
function fondo() {
  tiempoDia += 0.002;
  const t = (Math.sin(tiempoDia)+1)/2;

  const r = 146*t + 20*(1-t);
  const g = 189*t + 30*(1-t);
  const b = 233*t + 70*(1-t);

  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillRect(0,0,canvas.width,canvas.height*0.75);

  const grad = ctx.createLinearGradient(0, canvas.height*0.75, 0, canvas.height);
  grad.addColorStop(0,"#6fcf3b");
  grad.addColorStop(1,"#3f7d1f");

  ctx.fillStyle = grad;
  ctx.fillRect(0,canvas.height*0.75,canvas.width,canvas.height*0.25);

  // sol/luna
  const x = canvas.width-120;
  const y = 120 + Math.sin(tiempoDia)*50;

  ctx.globalAlpha = t;
  ctx.beginPath();
  ctx.arc(x,y,40,0,Math.PI*2);
  ctx.fillStyle="#FFD700";
  ctx.fill();

  ctx.globalAlpha = 1-t;
  ctx.beginPath();
  ctx.arc(x,y,30,0,Math.PI*2);
  ctx.fillStyle="#ddd";
  ctx.fill();

  ctx.globalAlpha = 1;
}

// 🌿 tallo corazón
function actualizarTallo() {
  const baseX = canvas.width * 0.55;
  const baseY = canvas.height * 0.75;

  puntos = [];

  for (let i = 0; i < clicks; i++) {
    const t = i / maxRosas;

    const scale = 12;
    const x = scale * 16 * Math.pow(Math.sin(t*Math.PI),3);
    const y = -scale*(13*Math.cos(t*Math.PI) - 5*Math.cos(2*t*Math.PI) - 2*Math.cos(3*t*Math.PI) - Math.cos(4*t*Math.PI));

    puntos.push({
      x: baseX + x,
      y: baseY + y
    });
  }
}

function dibujarTallo(viento) {
  if (puntos.length < 2) return;

  ctx.strokeStyle = "#7ed957";
  ctx.lineWidth = 6;

  ctx.beginPath();
  ctx.moveTo(puntos[0].x, puntos[0].y);

  for (let i = 1; i < puntos.length; i++) {
    ctx.lineTo(puntos[i].x + viento*5, puntos[i].y);
  }

  ctx.stroke();
}

// 🌹 rosa
function dibujarRosa(x,y,progreso,grande=false){
  const size = (grande?90:50)*progreso;

  if(grande){
    ctx.shadowColor="#ff8080";
    ctx.shadowBlur=30;
  }

  ctx.drawImage(imgRosa,x-size/2,y-size/2,size,size);
  ctx.shadowBlur=0;
}

// 🌹 rosas
function dibujarRosas(viento){
  for(let i=0;i<puntos.length;i++){
    const p=puntos[i];
    const ultima=(i===maxRosas-1);

    if(progresoRosas[i]<1) progresoRosas[i]+=0.03;

    dibujarRosa(p.x+viento*3,p.y,progresoRosas[i],ultima);

    if(Math.random()<0.006){
      crearPetalo(p.x,p.y);
    }

    if(ultima && progresoRosas[i]>=1){
      if(!explosionHecha){
        explosionPetalos(p.x,p.y);
        explosionHecha=true;
      }

      ctx.font="40px Dancing Script";
      ctx.fillStyle="white";
      ctx.fillText("Eres lo más bonito que tengo 💛", p.x-180, p.y-60);
    }
  }
}

// 🌱 semilla
function dibujarSemilla(){
  ctx.drawImage(imgSemilla,semillaX-semillaScale/2,semillaY-semillaScale/2,semillaScale,semillaScale);
}

// click
window.addEventListener("click",()=>{
  if(!plantada && !animandoSemilla){
    animandoSemilla=true;
  } else if(plantada && clicks<maxRosas){
    clicks++;
    agregarRosaSuelo();
  }
});

// loop
function loop(){
  requestAnimationFrame(loop);

  vientoTiempo += 0.01;
  const viento = Math.sin(vientoTiempo);

  fondo();
  dibujarMagia();
  dibujarRosasSuelo(viento);
  dibujarMariposas(viento);

  if(animandoSemilla && !plantada){
    semillaScale -= 0.5;

    if(semillaScale <= 10) cayendo=true;

    if(cayendo){
      semillaY += 4;

      if(semillaY >= canvas.height*0.75){
        plantada=true;
      }
    }
  }

  if(!plantada){
    dibujarSemilla();
  } else {
    actualizarTallo();
    dibujarTallo(viento);
    dibujarRosas(viento);
    dibujarPetalos(viento);
  }
}

loop();
</script>

</body>
</html>
