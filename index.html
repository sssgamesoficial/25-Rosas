<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Jardín mágico</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">

<style>
  body { margin: 0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>

<canvas id="lienzo"></canvas>

<script>
const canvas = document.getElementById("lienzo");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const maxRosas = 25;
let clicks = 0;
let explosionHecha = false;

// 🌅 tiempo día/noche (más rápido)
let tiempoDia = 0;

const imgRosa = new Image();
imgRosa.src = "rosa.png";

const imgSemilla = new Image();
imgSemilla.src = "semilla.png";

const frases = [
  "Eres hermosa","Me haces feliz","Eres única","Mi mundo eres tú",
  "Eres bella","Te quiero","Eres magia","Eres mi paz","Eres mi alegría","Eres mi sol",
  "Eres mi luna","Mi todo","Eres especial","Contigo todo","Eres luz",
  "Mi razón","Mi destino","Mi amor","Eres perfecta","Te necesito",
  "Eres arte","Mi sueño","Eres vida","Mi corazón","Es para ti 💛"
];

// 🌱 semilla
let semillaX = canvas.width / 2;
let semillaY = canvas.height / 2;
let semillaScale = 40;

let cayendo = false;
let plantada = false;
let animandoSemilla = false;

let puntos = [];
let progresoRosas = new Array(maxRosas).fill(0);

// 🌸 pétalos
const petalos = [];

function crearPetalo(x, y) {
  petalos.push({
    x, y,
    vx: Math.random() * 0.4 - 0.2,
    vy: Math.random() * 0.5 + 0.2,
    size: Math.random() * 2 + 1.5,
    rot: Math.random() * Math.PI,
    vr: Math.random() * 0.05 - 0.025
  });
}

// 💥 explosión SOLO última rosa
function explosionPetalos(x, y) {
  for (let i = 0; i < 100; i++) {
    petalos.push({
      x,
      y,
      vx: Math.random() * 5 - 2.5,
      vy: Math.random() * -5 - 1,
      size: Math.random() * 3 + 2,
      rot: Math.random() * Math.PI,
      vr: Math.random() * 0.1 - 0.05
    });
  }
}

function dibujarPetalos() {
  ctx.fillStyle = "#ff6b6b";

  petalos.forEach(p => {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);

    ctx.beginPath();
    ctx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();

    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.03; // más lento
    p.rot += p.vr;
  });
}

// 🌹 rosas suelo
const rosasSuelo = [];

function agregarRosaSuelo() {
  for (let i = 0; i < 3; i++) {
    rosasSuelo.push({
      x: Math.random() * canvas.width,
      y: canvas.height * 0.75 + Math.random() * 60,
      size: Math.random() * 30 + 30
    });
  }
}

function dibujarRosasSuelo() {
  rosasSuelo.forEach(r => {
    ctx.drawImage(imgRosa, r.x, r.y, r.size, r.size);
  });
}

// 🌅 fondo azul suave
function fondo() {
  tiempoDia += 0.003;

  const t = (Math.sin(tiempoDia) + 1) / 2;

  const dia = { r:180, g:210, b:255 };
  const noche = { r:60, g:90, b:150 };

  const r = dia.r * t + noche.r * (1 - t);
  const g = dia.g * t + noche.g * (1 - t);
  const b = dia.b * t + noche.b * (1 - t);

  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height * 0.75);

  ctx.fillStyle = `rgb(${r-40},${g-40},${b-40})`;
  ctx.fillRect(0, canvas.height * 0.75, canvas.width, canvas.height * 0.25);
}

// texto lateral
function textoLateral() {
  ctx.fillStyle = "white";
  ctx.font = "60px Dancing Script";

  const palabras = ["Estas", "25 rosas", "son", "porque:"];
  let y = 150;

  palabras.forEach(p => {
    ctx.fillText(p, 120, y);
    y += 80;
  });
}

// semilla
function dibujarSemilla() {
  ctx.drawImage(
    imgSemilla,
    semillaX - semillaScale/2,
    semillaY - semillaScale/2,
    semillaScale,
    semillaScale
  );
}

// 🌿 tallo normal (curva)
function actualizarTallo() {
  const baseX = canvas.width * 0.5;
  const baseY = canvas.height * 0.75;
  const tiempo = Date.now() * 0.001;

  puntos = [];

  for (let i = 0; i < clicks; i++) {
    const t = i / maxRosas;

    const viento = Math.sin(tiempo + i * 0.3) * 10;
    const curva = Math.sin(i * 0.4) * 100;

    const x = baseX + curva + viento;
    const y = baseY - t * canvas.height * 0.7;

    puntos.push({x, y});
  }
}

function dibujarTallo() {
  if (puntos.length < 2) return;

  ctx.strokeStyle = "#7ed957"; // verde claro bonito
  ctx.lineWidth = 6;

  ctx.beginPath();
  ctx.moveTo(puntos[0].x, puntos[0].y);

  for (let i = 1; i < puntos.length; i++) {
    ctx.quadraticCurveTo(
      puntos[i-1].x,
      puntos[i-1].y,
      puntos[i].x,
      puntos[i].y
    );
  }

  ctx.stroke();
}

// 🌹 rosa imagen
function dibujarRosa(x, y, progreso, grande=false) {
  const size = (grande ? 100 : 55) * progreso;

  ctx.drawImage(
    imgRosa,
    x - size/2,
    y - size/2,
    size,
    size
  );
}

// texto
function texto(txt, x, y) {
  ctx.font = "24px Dancing Script";
  ctx.fillStyle = "white";
  ctx.fillText(txt, x + 30, y - 10);
}

// 🌹 rosas
function dibujarRosas() {
  for (let i = 0; i < puntos.length; i++) {
    const p = puntos[i];
    const ultima = (i === puntos.length - 1);

    if (progresoRosas[i] < 1) {
      progresoRosas[i] += 0.04; // más rápido
    }

    dibujarRosa(p.x, p.y, progresoRosas[i], ultima);

    if (Math.random() < 0.01) {
      crearPetalo(p.x, p.y);
    }
  }

  for (let i = 0; i < puntos.length; i++) {
    const p = puntos[i];
    const ultima = (i === puntos.length - 1);

    if (progresoRosas[i] > 0.6 && i < frases.length) {
      texto(frases[i], p.x, p.y);
    }

    // 💥 SOLO última rosa
    if (ultima && progresoRosas[i] >= 1) {

      if (!explosionHecha && clicks === maxRosas) {
        explosionPetalos(p.x, p.y);
        explosionHecha = true;
      }

      // 💛 texto final arriba
      ctx.font = "45px Dancing Script";
      ctx.fillStyle = "white";
      ctx.textAlign = "center";
      ctx.fillText(
        "Eres lo más bonito que tengo 💛",
        canvas.width / 2,
        100
      );
      ctx.textAlign = "start";
    }
  }
}

// click
window.addEventListener("click", () => {
  if (!plantada && !animandoSemilla) {
    animandoSemilla = true;
  } else if (plantada && clicks < maxRosas) {
    clicks++;
    agregarRosaSuelo();
  }
});

// loop
function loop() {
  requestAnimationFrame(loop);

  fondo();
  textoLateral();
  dibujarRosasSuelo();

  if (animandoSemilla && !plantada) {
    semillaScale -= 0.6;

    if (semillaScale <= 10) cayendo = true;

    if (cayendo) {
      semillaY += 7;

      if (semillaY >= canvas.height * 0.75) {
        plantada = true;
      }
    }
  }

  if (!plantada) {
    dibujarSemilla();
  } else {
    actualizarTallo();
    dibujarTallo();
    dibujarRosas();
    dibujarPetalos();
  }
}

loop();
</script>

</body>
</html>
